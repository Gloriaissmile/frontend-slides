<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EEDF; --paper-2:#ECE6D2; --ink:#2A241B; --ink-soft:#5C5345;
  --pink:#E1A4C2; --lemon:#D6DD63; --blush:#E8C9B6; --sage:#B7C7A8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff);}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff);}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
img,video,canvas,svg{max-width:100%;max-height:100%;}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.2s !important;}}

body{ --stage-bg:#e7e1cd; --slide-bg:var(--paper); font-family:'Work Sans',sans-serif; }

.title-slide{ display:flex; flex-direction:column; justify-content:center; padding:0 200px; position:relative; }

.eyebrow-pill{
  display:inline-flex; align-items:center; width:fit-content;
  background:rgba(255,255,255,0.7); border-radius:999px;
  padding:12px 28px; margin-bottom:44px;
  font-size:18px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
  box-shadow:0 6px 18px rgba(42,36,27,0.06);
  opacity:0; transform:translateY(14px);
  transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);
}
.headline{
  font-family:'Cormorant Garamond',serif;
  font-weight:500; font-size:126px; line-height:1.04; color:var(--ink);
  max-width:1350px;
  opacity:0; transform:translateY(22px);
  transition:opacity .9s cubic-bezier(.16,1,.3,1) .15s, transform .9s cubic-bezier(.16,1,.3,1) .15s;
}
.headline em{ font-style:italic; font-weight:400; color:var(--ink); }
.tagline-pill{
  margin-top:44px; display:inline-flex; width:fit-content;
  background:var(--sage); border-radius:28px;
  padding:20px 36px;
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:32px; color:var(--ink);
  opacity:0; transition:opacity .8s ease .6s;
}
.slide.visible .eyebrow-pill{opacity:1;transform:translateY(0);}
.slide.visible .headline{opacity:1;transform:translateY(0);}
.slide.visible .tagline-pill{opacity:1;}
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <section class="slide active visible title-slide">
      <p class="eyebrow-pill">Share &amp; Tell &middot; A real-world case</p>
      <h1 class="headline">When AI Becomes<br>Your <em>Best Friend</em></h1>
      <p class="tagline-pill">Responsible to whom, and for what?</p>
    </section>
  </main>
</div>
<script>
function scaleStage(){const s=document.getElementById('deckStage');const f=Math.min(innerWidth/1920,innerHeight/1080);const x=(innerWidth-1920*f)/2,y=(innerHeight-1080*f)/2;s.style.transform=`translate(${x}px,${y}px) scale(${f})`;}
scaleStage();addEventListener('resize',scaleStage);
</script>
</body>
</html>
