<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9e4d4;
  --paper-line:#c9c2ac;
  --ink:#161412;
  --alarm:#b91c1c;
}
*{margin:0;padding:0;box-sizing:border-box;}

/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff);}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff);}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
img,video,canvas,svg{max-width:100%;max-height:100%;}
.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000;}
@media print{
  html,body{width:1920px;height:auto;overflow:visible;background:#fff;}
  .deck-viewport{position:static;overflow:visible;background:#fff;}
  .deck-stage{position:static;width:auto;height:auto;transform:none !important;background:none;}
  .slide{position:relative;display:block !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;width:1920px;height:1080px;break-after:page;page-break-after:always;}
  .slide:last-child{break-after:auto;page-break-after:auto;}
  .deck-controls{display:none !important;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.2s !important;}
}
/* =========================================== */

body{
  --stage-bg:#d8d2bd;
  --slide-bg:var(--paper);
  font-family:'JetBrains Mono',monospace;
}

.title-slide{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 190px;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 3px),
    var(--paper);
}
.title-slide::before{
  content:"";
  position:absolute; inset:56px;
  border:2px dashed var(--paper-line);
  pointer-events:none;
}

/* decorative redaction bars, top-right */
.redactions{ position:absolute; top:130px; right:200px; display:flex; flex-direction:column; gap:16px; align-items:flex-end; }
.redactions span{ display:block; height:20px; background:var(--ink); opacity:.86; }
.redactions span:nth-child(1){width:220px;}
.redactions span:nth-child(2){width:150px;}
.redactions span:nth-child(3){width:190px;}

.stamp{
  display:inline-flex;
  align-items:center;
  gap:14px;
  border:3px solid var(--alarm);
  color:var(--alarm);
  padding:10px 22px;
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:20px;
  letter-spacing:.16em;
  text-transform:uppercase;
  transform:rotate(-3deg);
  margin-bottom:44px;
  width:fit-content;
  opacity:0;
  transition:opacity .5s ease, transform .5s cubic-bezier(.16,1,.3,1);
}
.stamp .dot{width:9px;height:9px;border-radius:50%;background:var(--alarm);}

.headline{
  font-family:'Big Shoulders Display',sans-serif;
  font-weight:900;
  text-transform:uppercase;
  font-size:138px;
  line-height:0.94;
  color:var(--ink);
  max-width:1360px;
  opacity:0; transform:translateY(20px);
  transition:opacity .8s cubic-bezier(.16,1,.3,1) .12s, transform .8s cubic-bezier(.16,1,.3,1) .12s;
}
.headline span{ color:var(--alarm); }

.tagline-row{
  display:flex;
  align-items:center;
  gap:16px;
  margin-top:40px;
  opacity:0;
  transition:opacity .7s ease .62s;
}
.tagline-row .bracket{ color:var(--alarm); font-weight:700; font-size:26px; }
.tagline{
  font-size:26px;
  color:var(--ink);
}
.cursor{
  display:inline-block; width:14px; height:28px; background:var(--ink);
  margin-left:4px; vertical-align:-6px;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{ 50%{ opacity:0; } }

.slide.visible .stamp{opacity:1; transform:rotate(-3deg);}
.slide.visible .headline{opacity:1; transform:translateY(0);}
.slide.visible .tagline-row{opacity:1;}
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <section class="slide active visible title-slide">
      <div class="redactions"><span></span><span></span><span></span></div>
      <div class="stamp"><span class="dot"></span>Share &amp; Tell &middot; Case File</div>
      <h1 class="headline">When AI<br>Becomes Your<br><span>Best Friend</span></h1>
      <div class="tagline-row">
        <span class="bracket">&raquo;</span>
        <span class="tagline">Responsible to whom, and for what?<span class="cursor"></span></span>
      </div>
    </section>
  </main>
</div>
<script>
function scaleStage(){
  const stage=document.getElementById('deckStage');
  const f=Math.min(window.innerWidth/1920, window.innerHeight/1080);
  const x=(window.innerWidth-1920*f)/2, y=(window.innerHeight-1080*f)/2;
  stage.style.transform=`translate(${x}px, ${y}px) scale(${f})`;
}
scaleStage();
window.addEventListener('resize', scaleStage);
</script>
</body>
</html>
