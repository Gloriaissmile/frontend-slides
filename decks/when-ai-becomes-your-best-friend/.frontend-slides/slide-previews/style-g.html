<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style G</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5F0E6; --turquoise:#7ECDC0; --pink:#F7C8D4; --butter:#FDE68A;
  --mint:#A8E6CF; --lavender:#D4A5E8; --peach:#FFCBA4; --sky:#A8D8F0; --dark:#3A342B;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff);}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff);}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
img,video,canvas,svg{max-width:100%;max-height:100%;}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.2s !important;}}

body{ --stage-bg:#e4ddc9; --slide-bg:var(--cream); font-family:'Quicksand',sans-serif; }

.title-slide{ display:flex; flex-direction:column; justify-content:center; padding:0 200px; position:relative; }

.decor{ position:absolute; }
.decor svg{ display:block; }

.eyebrow-pill{
  display:inline-flex; align-items:center; gap:10px; width:fit-content;
  background:var(--sky); border:3px solid var(--dark); border-radius:999px;
  padding:12px 26px; margin-bottom:40px;
  font-weight:700; font-size:18px; color:var(--dark);
  box-shadow:6px 6px 0 var(--dark);
  opacity:0; transform:translateY(14px);
  transition:opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1);
}
.headline-card{
  background:#fff; border:4px solid var(--dark); border-radius:32px;
  padding:52px 60px; box-shadow:14px 14px 0 var(--dark);
  width:fit-content; max-width:1450px;
  opacity:0; transform:translateY(22px) scale(.97);
  transition:opacity .7s cubic-bezier(.16,1,.3,1) .15s, transform .7s cubic-bezier(.16,1,.3,1) .15s;
}
.headline{
  font-family:'Fredoka One',sans-serif; font-size:96px; line-height:1.08; color:var(--dark);
}
.headline .hl{ color:#D6558A; }
.tagline{
  margin-top:36px; font-weight:600; font-size:30px; color:var(--dark);
  opacity:0; transition:opacity .7s ease .6s;
}
.slide.visible .eyebrow-pill{opacity:1;transform:translateY(0);}
.slide.visible .headline-card{opacity:1;transform:translateY(0) scale(1);}
.slide.visible .tagline{opacity:1;}
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <section class="slide active visible title-slide">
      <!-- hand-drawn-style decorations -->
      <div class="decor" style="top:70px; right:150px;">
        <svg width="130" height="130" viewBox="0 0 100 100">
          <g fill="none" stroke="#3A342B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
            <circle cx="50" cy="30" r="14" fill="#FDE68A"/>
            <circle cx="50" cy="70" r="14" fill="#FDE68A"/>
            <circle cx="30" cy="50" r="14" fill="#FDE68A"/>
            <circle cx="70" cy="50" r="14" fill="#FDE68A"/>
            <circle cx="35" cy="35" r="14" fill="#FDE68A"/>
            <circle cx="65" cy="35" r="14" fill="#FDE68A"/>
            <circle cx="35" cy="65" r="14" fill="#FDE68A"/>
            <circle cx="65" cy="65" r="14" fill="#FDE68A"/>
            <circle cx="50" cy="50" r="16" fill="#F7C8D4"/>
          </g>
        </svg>
      </div>
      <div class="decor" style="bottom:90px; right:260px;">
        <svg width="70" height="70" viewBox="0 0 24 24" fill="#A8E6CF" stroke="#3A342B" stroke-width="1.5" stroke-linejoin="round">
          <path d="M12 2l2.4 6.8L21 11l-6.6 2.2L12 20l-2.4-6.8L3 11l6.6-2.2L12 2z"/>
        </svg>
      </div>
      <div class="decor" style="bottom:60px; left:120px;">
        <svg width="90" height="50" viewBox="0 0 100 60" fill="none" stroke="#3A342B" stroke-width="3" stroke-linecap="round">
          <path d="M10 45 A40 40 0 0 1 90 45" stroke="#D4A5E8"/>
          <path d="M20 45 A30 30 0 0 1 80 45" stroke="#A8D8F0"/>
          <path d="M30 45 A20 20 0 0 1 70 45" stroke="#FFCBA4"/>
        </svg>
      </div>

      <p class="eyebrow-pill">&#9733; Share &amp; Tell &middot; A real-world case</p>
      <div class="headline-card">
        <h1 class="headline">When AI Becomes<br>Your <span class="hl">Best Friend</span></h1>
        <p class="tagline">Responsible to whom, and for what?</p>
      </div>
    </section>
  </main>
</div>
<script>
function scaleStage(){const s=document.getElementById('deckStage');const f=Math.min(innerWidth/1920,innerHeight/1080);const x=(innerWidth-1920*f)/2,y=(innerHeight-1080*f)/2;s.style.transform=`translate(${x}px,${y}px) scale(${f})`;}
scaleStage();addEventListener('resize',scaleStage);
</script>
</body>
</html>
