<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style E</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#2E4A2A; --green-deep:#243A21; --pink:#E89CB1; --pink-deep:#D27E96;
  --cream:#EFE7D4; --cream-2:#E6DCC4; --ink:#1A1A17;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff);}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff);}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
img,video,canvas,svg{max-width:100%;max-height:100%;}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.2s !important;}}

body{ --stage-bg:#e2d9bc; --slide-bg:var(--cream); font-family:'Source Serif 4',serif; }

.title-slide{ display:flex; flex-direction:column; justify-content:center; padding:0 200px; position:relative; }
.title-slide::before{
  content:""; position:absolute; left:200px; top:120px; width:64px; height:6px; background:var(--pink);
}

.kicker{
  font-family:'JetBrains Mono',monospace; font-weight:600; font-size:19px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--green);
  margin-bottom:40px;
  opacity:0; transform:translateY(14px);
  transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);
}
.headline{
  font-family:'Source Serif 4',serif; font-weight:500; font-size:118px; line-height:1.05;
  color:var(--ink); max-width:1400px;
  opacity:0; transform:translateY(22px);
  transition:opacity .9s cubic-bezier(.16,1,.3,1) .15s, transform .9s cubic-bezier(.16,1,.3,1) .15s;
}
.headline .accent{ color:var(--pink-deep); }
.rule{ width:110px; height:2px; background:var(--green); margin:44px 0 30px; transform:scaleX(0); transform-origin:left; transition:transform .8s cubic-bezier(.16,1,.3,1) .5s; }
.tagline{
  font-family:'JetBrains Mono',monospace; font-weight:500; font-size:24px; letter-spacing:.02em; color:var(--green-deep);
  opacity:0; transition:opacity .8s ease .68s;
}
.slide.visible .kicker{opacity:1;transform:translateY(0);}
.slide.visible .headline{opacity:1;transform:translateY(0);}
.slide.visible .rule{transform:scaleX(1);}
.slide.visible .tagline{opacity:1;}
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <section class="slide active visible title-slide">
      <p class="kicker">Share &amp; Tell &middot; A Real-World Case</p>
      <h1 class="headline">When AI Becomes<br>Your <span class="accent">Best Friend</span></h1>
      <div class="rule"></div>
      <p class="tagline">RESPONSIBLE TO WHOM, AND FOR WHAT?</p>
    </section>
  </main>
</div>
<script>
function scaleStage(){const s=document.getElementById('deckStage');const f=Math.min(innerWidth/1920,innerHeight/1080);const x=(innerWidth-1920*f)/2,y=(innerHeight-1080*f)/2;s.style.transform=`translate(${x}px,${y}px) scale(${f})`;}
scaleStage();addEventListener('resize',scaleStage);
</script>
</body>
</html>
