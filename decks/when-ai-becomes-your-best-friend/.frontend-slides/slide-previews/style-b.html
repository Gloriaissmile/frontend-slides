<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=DM+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1C2644;
  --navy-alt:#232F55;
  --cream:#F0ECE3;
  --gold:#C8A870;
  --text-warm:#E2DCD0;
  --text-muted:#8A96A8;
  --border-dark:rgba(200,168,112,0.22);
}
*{margin:0;padding:0;box-sizing:border-box;}

/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff);}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff);}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
img,video,canvas,svg{max-width:100%;max-height:100%;}
.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000;}
@media print{
  html,body{width:1920px;height:auto;overflow:visible;background:#fff;}
  .deck-viewport{position:static;overflow:visible;background:#fff;}
  .deck-stage{position:static;width:auto;height:auto;transform:none !important;background:none;}
  .slide{position:relative;display:block !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;width:1920px;height:1080px;break-after:page;page-break-after:always;}
  .slide:last-child{break-after:auto;page-break-after:auto;}
  .deck-controls{display:none !important;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.2s !important;}
}
/* =========================================== */

body{ --stage-bg:#10162b; --slide-bg:var(--navy); font-family:'DM Sans',sans-serif; }

.title-slide{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 200px;
  background-image:
    linear-gradient(rgba(200,168,112,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,168,112,0.05) 1px, transparent 1px);
  background-size:80px 80px;
}
.title-slide::after{
  content:"";
  position:absolute; inset:64px;
  border:1px solid var(--border-dark);
  pointer-events:none;
}

.kicker{
  font-family:'IBM Plex Mono',monospace;
  font-size:19px;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:38px;
  opacity:0; transform:translateY(14px);
  transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);
}
.headline{
  font-family:'Source Serif 4',serif;
  font-weight:600;
  font-size:120px;
  line-height:1.06;
  color:var(--text-warm);
  max-width:1350px;
  opacity:0; transform:translateY(22px);
  transition:opacity .9s cubic-bezier(.16,1,.3,1) .15s, transform .9s cubic-bezier(.16,1,.3,1) .15s;
}
.headline em{ font-style:italic; color:var(--gold); font-weight:500; }
.rule{
  width:96px;height:1px;background:var(--gold);
  margin:44px 0 32px;
  transform:scaleX(0); transform-origin:left;
  transition:transform .8s cubic-bezier(.16,1,.3,1) .5s;
}
.tagline{
  font-family:'DM Sans',sans-serif;
  font-size:30px;
  color:var(--text-muted);
  opacity:0;
  transition:opacity .8s ease .68s;
}
.slide.visible .kicker{opacity:1;transform:translateY(0);}
.slide.visible .headline{opacity:1;transform:translateY(0);}
.slide.visible .rule{transform:scaleX(1);}
.slide.visible .tagline{opacity:1;}
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <section class="slide active visible title-slide">
      <p class="kicker">Share &amp; Tell — 001</p>
      <h1 class="headline">When AI Becomes<br>Your <em>Best Friend</em></h1>
      <div class="rule"></div>
      <p class="tagline">Responsible to whom, and for what?</p>
    </section>
  </main>
</div>
<script>
function scaleStage(){
  const stage=document.getElementById('deckStage');
  const f=Math.min(window.innerWidth/1920, window.innerHeight/1080);
  const x=(window.innerWidth-1920*f)/2, y=(window.innerHeight-1080*f)/2;
  stage.style.transform=`translate(${x}px, ${y}px) scale(${f})`;
}
scaleStage();
window.addEventListener('resize', scaleStage);
</script>
</body>
</html>
